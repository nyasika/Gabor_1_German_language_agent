name: Reminders

# GitHub cron is UTC and, for this repo, unreliable: scheduled runs have been
# landing hours late (sometimes past local midnight). scripts/send_push.mjs no
# longer assumes "now" is close to a slot's clock time - it sends every slot not
# yet recorded in reminder_state.json for its latest Zurich-local occurrence,
# and this workflow commits that file back when something was sent.
on:
  schedule:
    - cron: '0 5,6 * * *'
    - cron: '30 18,19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send a test notification now'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/send_push.mjs
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          FORCE: ${{ inputs.force }}
      - name: Record which reminders were sent
        if: always()
        run: |
          if ! git diff --quiet -- reminder_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reminder_state.json
            git commit -m "Record sent reminders"
            git push
          else
            echo "No state change to commit."
          fi
